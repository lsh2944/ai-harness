name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unit tests
        shell: bash
        run: |
          set -u
          suites="hooks/tests install/tests tools/tests tools/investigation tools/task_metrics tools/aws"
          # cross-check は macOS 専用（/bin/zsh とファイル作成時刻を前提にする。Windows 対応は 2 段階目）
          if [ "$RUNNER_OS" = "macOS" ]; then
            suites="$suites skills/cross-check/tests"
          fi
          # Mac/Linux のランナーは作業ディレクトリが .../work/... にあり、作業ルートの検査（/work/ を含まないこと）と
          # 衝突するため、パスに work を含まない一時ディレクトリへ複製して実行する
          if [ "$RUNNER_OS" != "Windows" ]; then
            cp -R . /tmp/ai-harness
            cd /tmp/ai-harness
          fi
          status=0
          for suite in $suites; do
            echo "::group::$suite"
            python -m unittest discover -s "$suite" -t "$suite" || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: privacy check (tracked files)
        shell: bash
        run: python tools/privacy_check.py --all
